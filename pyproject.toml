[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-robot"
version = "0.1.0"
description = "Mobile Engineering Support Hexapod (The Brain)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "colorama",
    "requests",
    "numpy",
    "scipy",
    "Pillow",
    "pytest",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "customtkinter",
    "python-dotenv",
    "sounddevice",
    "soundfile",
    "opencv-python",
    "google-genai"
]

[project.optional-dependencies]
server = [
    "faster-whisper",
    "f5-tts",
    "chatterbox-tts",
    "torch",
    "torchaudio",
    "torchvision"
]

client = [
]

robot = [
    "rpi-ws281x",
    "spidev",
    "smbus2",
    "gpiozero",
    "RPi.GPIO"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
