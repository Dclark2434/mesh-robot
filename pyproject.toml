[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-robot"
version = "0.2.0"
description = "Mobile Engineering Support Hexapod - a real-time conversational hexapod"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Shared by both halves: the wire protocol, logging, and config loading.
dependencies = [
    "colorama",
    "numpy",
    "python-dotenv",
]

[project.optional-dependencies]
# The brain. Runs on the workstation.
brain = [
    "pipecat-ai[deepgram,elevenlabs,google,livekit,local-smart-turn,silero]>=1.1.0",
    "livekit-api",
    # Serves the dashboard. Already a pipecat dependency; named here because
    # this project imports it directly.
    "aiohttp",
    "pillow",
]

# The robot, on any machine. Audio and the LiveKit session, no GPIO.
robot = [
    "livekit",
    "livekit-api",
    "sounddevice",
]

# Hardware drivers. Raspberry Pi only -- these will not build elsewhere.
# picamera2 is not listed: it ships with Raspberry Pi OS and installs badly
# from pip. Use `apt install python3-picamera2` for a CSI camera.
hardware = [
    "rpi-ws281x",
    "spidev",
    "smbus2",
    "gpiozero",
    "RPi.GPIO",
]

# USB webcam support. Not needed for CSI cameras.
usb-camera = [
    "opencv-python-headless",
]

dev = [
    "pytest",
]

[project.scripts]
mesh-brain = "mesh_server.app:main"
mesh-robot = "mesh_client.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mesh_server = ["personalities/*.txt", "dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
